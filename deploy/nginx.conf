# BEAM Campfire (PWA) - nginx server blocks. Runs on nginx 1.24 or newer.
#
# Requirements (docs/beam/PWA.md, "Deployment"):
# - Its own origin (a dedicated host name). Never a shared origin such as
#   <user>.github.io: IndexedDB, the service worker and passkeys are per origin.
# - HTTPS (service workers, WebAuthn and the wss:// node need a secure context).
# - The security headers below on EVERY response. COOP + COEP make the page
#   cross-origin isolated; without that the wallet engine cannot start.
#   tools/build.mjs fails if these lines drift from tools/headers.mjs.
# - The loader (sw-<hash>.js) gets its own policy: with the page policy it can
#   never fetch an update from another copy, and a device keeps the policy its
#   loader was first fetched with.
# - Same-origin access to BEAM's recovery snapshot and to an explorer height,
#   so the browser talks to this origin and the chosen BEAM node only. The
#   snapshot relay is also read by copies of the app that have no relay of their
#   own (lib/recovery.js), so it is open to any origin, read-only.
# - Access-Control-Allow-Origin: * on the app's files (not on the explorer proxy),
#   so this copy can also serve updates to installs whose own address is gone.
# - connect-src names BEAM's node pool only. A person's own node is added by
#   the installed app's service worker to the pages it serves, never here:
#   these headers only cover the first load, before the worker takes over.
#
# Replace wallet.example.org and the certificate paths. Serve only a verified release:
# deploy/verify_and_switch.sh checks a pulled checkout of the hosting repository (signature,
# manifest, every file) against a pinned release key and points /srv/beam-campfire/current at a
# folder holding exactly the signed files; the checkout itself is never served.
# After every deploy, check what the public address really serves (a CDN in front can change
# headers the build cannot see; read-only): node tools/check_deploy.mjs https://<address>/
# The map blocks belong to the http context: as here, in a file nginx includes
# from http {} (conf.d/), next to the server blocks.

# Headers that differ by path (tools/headers.mjs headersFor()). Pages get the
# strict policy; the loader is a worker whose own policy lets it fetch a signed
# update from another copy when this address does not answer (it checks every
# byte before keeping it). An empty value: nginx leaves the header out.
map $uri $campfire_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://eu-node02.mainnet.beam.mw:8200 wss://eu-node03.mainnet.beam.mw:8200 wss://eu-node04.mainnet.beam.mw:8200 wss://eu-nodes.mainnet.beam.mw:8200 wss://eu-node01.mainnet.beam.mw:8200 https://raw.githubusercontent.com/BeamMW/beam-ui/2f36c21ed010dee350c052ffce9097b23f69ecfb/ui/apps/mainnet/ https://eth2.stackwallet.com https://ethereum-rpc.publicnode.com https://eth.drpc.org https://rpc.mevblocker.io https://eth-mainnet.public.blastapi.io https://api.coingecko.com/api/v3/simple/price https://buybeam.my/api/v1/buy/ https://1click.chaindefuser.com/v0/ https://pwa.buybeam.my/recovery/; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";
    "~^/sw(-[0-9a-f]+)?\.js$" "default-src 'none'; connect-src 'self' https:";
}
map $uri $campfire_corp {
    default "same-origin";
    /recovery/mainnet_recovery.bin "cross-origin";
}
map $uri $campfire_acao {
    default "*";
    /explorer/status "";
}
map $uri $campfire_acam {
    default "";
    /recovery/mainnet_recovery.bin "GET, HEAD";
}
map $uri $campfire_acah {
    default "";
    /recovery/mainnet_recovery.bin "Range, If-Range";
}
map $uri $campfire_aceh {
    default "";
    /recovery/mainnet_recovery.bin "Content-Length, Content-Range, ETag, Last-Modified";
}
map $uri $campfire_acma {
    default "";
    /recovery/mainnet_recovery.bin "86400";
}
map $uri $campfire_cache {
    default "no-cache";
    /recovery/mainnet_recovery.bin "";
}

server {
    listen 80;
    listen [::]:80;
    server_name wallet.example.org;
    return 301 https://$server_name$request_uri;
}

server {
    # "listen ... http2" rather than "http2 on;", which nginx 1.24 does not know.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.example.org;

    ssl_certificate     /etc/ssl/wallet.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/wallet.example.org/privkey.pem;

    root /srv/beam-campfire/current;
    index index.html;
    server_tokens off;

    # At server level only: nginx drops these in any location that has an add_header of its own.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $campfire_csp always;
    add_header Cross-Origin-Resource-Policy $campfire_corp always;
    add_header Access-Control-Allow-Origin $campfire_acao always;
    add_header Access-Control-Allow-Methods $campfire_acam always;
    add_header Access-Control-Allow-Headers $campfire_acah always;
    add_header Access-Control-Expose-Headers $campfire_aceh always;
    add_header Access-Control-Max-Age $campfire_acma always;
    add_header Cache-Control $campfire_cache always;

    # No access log of client IPs: a privacy wallet's host should not keep them. The error
    # log names the client too ("client: <IP>" for a missing file or a failed upstream), so
    # only critical errors are written.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    log_not_found off;

    # The whole table: a types block here replaces nginx's mime.types, it does not add to it.
    # The same Content-Type the loader serves (tools/headers.mjs MIME): text types say UTF-8.
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json jwk;
        application/wasm wasm;
        application/manifest+json webmanifest;
        image/png png;
        image/svg+xml svg;
        font/ttf ttf;
        font/woff2 woff2;
        text/plain txt sig;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/javascript text/plain; # text/html always has it

    # The hosting repository's own files are not part of the app.
    location = /_headers { return 404; }
    location = /README.md { return 404; }
    location ^~ /deploy/ { return 404; }
    location ~ "^/\.(?!well-known/)" { return 404; }

    location = / {
        try_files /index.html =404;
    }

    # dapp-run/... (dApp frames) is answered by the installed app's service
    # worker only. Here it is a 404 on purpose: a frame never comes from the network.
    location / {
        try_files $uri =404;
    }

    # Both proxies check the upstream's certificate and name (nginx does not by default):
    # Debian/Ubuntu keep the system CAs at /etc/ssl/certs/ca-certificates.crt
    # (RHEL: /etc/pki/tls/certs/ca-bundle.crt).

    # BEAM's daily recovery snapshot (~330 MB). Streamed, not buffered to disk.
    # A mirror refreshed daily works too (it must be BEAM's own file). Any origin
    # may read it (the maps above): a resumed download asks first with OPTIONS.
    location = /recovery/mainnet_recovery.bin {
        # Both in the rewrite phase: limit_except would refuse the OPTIONS before any "if" ran.
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass https://mobile-restore.beam.mw/mainnet/mainnet_recovery.bin;
        proxy_ssl_server_name on;
        proxy_ssl_name mobile-restore.beam.mw;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host mobile-restore.beam.mw;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
    }

    # Independent chain height for the sync check. Only height and timestamp are used.
    # For this origin only: no CORS.
    location = /explorer/status {
        limit_except GET { deny all; }
        proxy_pass https://explorer.0xmx.net/api/status;
        proxy_ssl_server_name on;
        proxy_ssl_name explorer.0xmx.net;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host explorer.0xmx.net;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 6s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
    }
}
