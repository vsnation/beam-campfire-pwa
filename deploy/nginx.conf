# BEAM Campfire (PWA) - example nginx server block.
#
# Requirements (docs/beam/PWA.md, "Deployment"):
# - Its own origin (a dedicated host name). Never a shared origin such as
#   <user>.github.io: IndexedDB, the service worker and passkeys are per origin.
# - HTTPS (service workers, WebAuthn and the wss:// node need a secure context).
# - The security headers below on EVERY response. COOP + COEP make the page
#   cross-origin isolated; without that the wallet engine cannot start.
#   tools/build.mjs fails if these lines drift from tools/headers.mjs.
# - Same-origin access to BEAM's recovery snapshot and to an explorer height,
#   so the browser talks to this origin and the chosen BEAM node only.
#
# Replace wallet.example.org and the certificate paths, put these files at /srv/beam-campfire (git clone --depth 1 https://github.com/vsnation/beam-campfire-pwa /srv/beam-campfire).

server {
    listen 443 ssl;
    http2 on;
    server_name wallet.example.org;

    ssl_certificate     /etc/ssl/wallet.example.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/wallet.example.org/privkey.pem;

    root /srv/beam-campfire;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' wss://eu-nodes.mainnet.beam.mw:8200 wss://eu-node01.mainnet.beam.mw:8200 wss://eu-node02.mainnet.beam.mw:8200 https://raw.githubusercontent.com/BeamMW/beam-ui/2f36c21ed010dee350c052ffce9097b23f69ecfb/ui/apps/mainnet/ https://eth2.stackwallet.com https://ethereum-rpc.publicnode.com https://eth.drpc.org https://rpc.mevblocker.io https://eth-mainnet.public.blastapi.io https://api.coingecko.com/api/v3/simple/price https://buybeam.my/api/v1/buy/; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
    add_header Cache-Control "no-cache" always;

    # No access log of client IPs: a privacy wallet's host should not keep them.
    access_log off;

    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    location = /_headers { return 404; }

    location / {
        try_files $uri =404;
    }

    # BEAM's daily recovery snapshot (~330 MB). Streamed, not buffered to disk.
    # A mirror refreshed daily works too (it must be BEAM's own file).
    location = /recovery/mainnet_recovery.bin {
        limit_except GET HEAD { deny all; }
        proxy_pass https://mobile-restore.beam.mw/mainnet/mainnet_recovery.bin;
        proxy_ssl_server_name on;
        proxy_set_header Host mobile-restore.beam.mw;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # Independent chain height for the sync check. Only height and timestamp are used.
    location = /explorer/status {
        limit_except GET { deny all; }
        proxy_pass https://explorer.0xmx.net/api/status;
        proxy_ssl_server_name on;
        proxy_set_header Host explorer.0xmx.net;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 6s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
    }
}
